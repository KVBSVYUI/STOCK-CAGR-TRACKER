name: Fix gross profit label
on:
  push:
    paths:
      - '.github/workflows/fix-gross-profit-label.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update label
        run: sed -i 's/Gross profit after manually entered charges/Gross profit after charges/g' index.html
      - name: Commit and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-gross-profit-label.yml
          git commit -m 'Shorten gross profit label'
          git push
