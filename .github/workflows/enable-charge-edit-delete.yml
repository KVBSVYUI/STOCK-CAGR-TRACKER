name: Enable charge edit delete
on:
  push:
    paths:
      - '.github/workflows/enable-charge-edit-delete.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 patch_charge_edit.py
      - name: Remove patch helper
        run: rm patch_charge_edit.py
      - name: Commit changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html patch_charge_edit.py
          git commit -m 'Add charge edit and delete controls'
          git push
