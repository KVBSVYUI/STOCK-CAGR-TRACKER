<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Setup · Booked Profit Tracker</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07101a;color:#eef4fb;font-family:Inter,system-ui,sans-serif}.card{width:min(420px,calc(100vw - 32px));box-sizing:border-box;padding:26px;border:1px solid #243247;border-radius:20px;background:#0c1724;box-shadow:0 25px 70px #0008}h1{font-size:21px;margin:0 0 8px}p{color:#8d9aae;font-size:13px;line-height:1.5}label{display:block;font-size:12px;margin-top:18px}input{box-sizing:border-box;width:100%;margin-top:7px;padding:12px;border-radius:11px;border:1px solid #304158;background:#08111c;color:#fff}button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:11px;background:#36c98b;color:#06110c;font-weight:800;cursor:pointer}#status{margin-top:14px;font-size:12px}</style></head><body><main class="card"><h1>🛡️ Administrator Setup</h1><p>Sign in to Booked Profit Tracker in another tab first. Then enter the private administrator setup code configured for the Firebase backend.</p><label>Setup code<input id="secret" type="password" autocomplete="off" placeholder="Private setup code"></label><button id="go">Enable administrator access</button><div id="status"></div></main><script type="module">const APP='https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js',AUTH='https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js',FN='https://www.gstatic.com/firebasejs/12.2.1/firebase-functions.js';const cfg={apiKey:'AIzaSyAokMEP3H618OgHAMLSoQcbFVE_DtPAiig',authDomain:'booked-profit-tracker.firebaseapp.com',projectId:'booked-profit-tracker',storageBucket:'booked-profit-tracker.firebasestorage.app',messagingSenderId:'401080852',appId:'1:401080852754:web:8f449ad7d2cd44314993cb'};const [a,am,fm]=await Promise.all([import(APP),import(AUTH),import(FN)]);const app=a.initializeApp(cfg);const auth=am.getAuth(app);const status=document.getElementById('status');document.getElementById('go').onclick=async()=>{const u=auth.currentUser;if(!u){status.textContent='Please sign in to the main tracker first, then return here.';return}const secret=document.getElementById('secret').value.trim();if(!secret){status.textContent='Enter the setup code.';return}const btn=document.getElementById('go');btn.disabled=true;btn.textContent='Enabling…';try{const functions=fm.getFunctions(app,'asia-south1');const result=await fm.httpsCallable(functions,'bootstrapAdmin')({secret});status.textContent=result.data.message||'Administrator enabled.'}catch(e){status.textContent=e.message||'Could not enable administrator access.'}finally{btn.disabled=false;btn.textContent='Enable administrator access'}};</script></body></html>
