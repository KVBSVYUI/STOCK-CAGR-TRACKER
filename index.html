<style>

*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:radial-gradient(900px 500px at 12% -5%,#132238 0,#070b12 55%);min-height:100vh}button,input,select{font:inherit}button{cursor:pointer}.app{width:min(980px,100%);margin:auto;padding:18px 16px 60px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}.brand{display:flex;align-items:center;gap:11px}.mark{width:44px;height:44px;border-radius:14px;background:#101b2a;border:1px solid #26364d;display:grid;place-items:center}.mark svg{width:27px}.brand h1{font-size:17px;margin:0;letter-spacing:-.02em}.brand p{font-size:10px;color:var(--muted);margin:2px 0 0}.right{display:flex;align-items:center;gap:9px}.sync{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px #42df9b}.icon{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:#0d141f;color:var(--text)}

.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:14px}.primary,.secondary{border-radius:12px;padding:10px 14px;font-weight:800;border:1px solid var(--line2)}.primary{background:linear-gradient(135deg,#56e6a4,#2ac785);color:#06120c;border:0}.secondary{background:#0e1724;color:var(--text)}
.section{margin-top:14px}.card{background:linear-gradient(180deg,#0d141f,#0a1018);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 12px 35px #0003}.section-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 18px 12px}.title{margin:0;font-size:15px}.sub{margin:4px 0 0;color:var(--muted);font-size:10px}.charges-line{display:flex;align-items:center;justify-content:space-between;padding:0 18px 15px;color:var(--muted);font-size:10px}.charges-line b{font-size:13px;color:var(--text)}
.trades{padding:0 12px 12px}.trade{display:grid;grid-template-columns:48px minmax(170px,1.5fr) 1fr 1fr 115px 32px;gap:12px;align-items:center;padding:14px 7px;border-top:1px solid var(--line)}.trade-main b{font-size:13px}.trade-main span{display:block;color:var(--muted);font-size:9px;margin-top:4px}.logo{width:42px;height:42px;border-radius:12px;background:#142033;border:1px solid #263a54;display:grid;place-items:center;overflow:hidden;font-size:11px;font-weight:850;color:#b9c9dc}.logo img{width:100%;height:100%;object-fit:contain;background:#fff}.stat .k{display:block;font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}.stat .v{display:block;font-size:11px;font-weight:760;margin-top:4px}.trade-result{text-align:right}.trade-result .profit{font-size:13px;letter-spacing:0;margin:0}.return{font-size:10px;margin-top:3px;font-weight:800}.delete{border:0;background:transparent;color:#687990;font-size:16px}.delete:hover{color:var(--red)}.empty{text-align:center;padding:42px 20px;color:var(--muted);font-size:11px}.empty strong{display:block;color:var(--text);margin-bottom:4px}
.form{padding:0 18px 18px;display:grid;grid-template-columns:1.4fr .7fr .9fr .9fr 1fr 1fr;gap:10px}.field label{display:block;color:var(--muted);font-size:9px;margin:0 0 5px}.field input{width:100%;background:#080f19;border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px 10px;outline:none}.field input:focus{border-color:#5d8ee2;box-shadow:0 0 0 3px #5d8ee21a}.company{position:relative}.preview{position:absolute;right:6px;bottom:6px;width:28px;height:28px;border-radius:8px;background:#172438;overflow:hidden;display:grid;place-items:center;font-size:9px;font-weight:850}.preview img{width:100%;height:100%;object-fit:contain;background:#fff}.form .full{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}.auto{color:#73849b;font-size:10px;padding-top:8px}.hintline{grid-column:1/-1;color:#66778f;font-size:9px;line-height:1.5}
.modal-back{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;justify-content:center;padding:12px;z-index:50}.modal-back.open{display:flex}.modal{width:min(560px,100%);max-height:90dvh;overflow:auto;background:#0c141f;border:1px solid #2a3a51;border-radius:22px;padding:20px;box-shadow:0 30px 90px #000b}.modal h3{margin:0;font-size:18px}.modal p{color:var(--muted);font-size:11px;line-height:1.5}.close{float:right;border:0;background:transparent;color:#8291a6;font-size:24px}.modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.modal-grid .field.full{grid-column:1/-1}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.detail-head{display:flex;align-items:center;gap:12px;margin-top:12px}.detail-logo{width:52px;height:52px;border-radius:15px;background:#17253a;overflow:hidden;display:grid;place-items:center;font-weight:850}.detail-logo img{width:100%;height:100%;object-fit:contain;background:#fff}.detail-name b{font-size:17px}.detail-name span{display:block;color:var(--muted);font-size:10px;margin-top:3px}.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.detail-item{background:#0a111b;border:1px solid var(--line);border-radius:13px;padding:11px}.detail-item span{display:block;color:var(--muted);font-size:9px}.detail-item b{display:block;margin-top:4px;font-size:13px}
.auth{min-height:100dvh;display:grid;place-items:center;padding:18px}.auth-card{width:min(420px,100%);background:#0d151f;border:1px solid #26374e;border-radius:24px;padding:25px;box-shadow:var(--shadow)}.auth-mark{width:58px;height:58px;border-radius:17px;background:#132239;display:grid;place-items:center;margin-bottom:17px}.auth h2{margin:0;font-size:24px}.auth p{color:var(--muted);font-size:11px;line-height:1.5}.auth .field{margin-top:12px}.auth-actions{display:grid;gap:8px;margin-top:15px}.error{min-height:15px;color:var(--red);font-size:10px;margin-top:7px}.foot{margin-top:17px;text-align:center;color:#5f7088;font-size:9px}
@media(max-width:800px){.trade{grid-template-columns:44px 1fr 120px 32px}.trade .stat{display:none}.trade-result{text-align:right}.form{grid-template-columns:1fr 1fr 1fr}.form .company{grid-column:1/-1}.form .full{grid-column:1/-1}.kpis{grid-template-columns:1fr 1fr}}
@media(max-width:560px){.app{padding:12px 10px 42px}.top{margin-bottom:12px}.sync{display:none}.hero{padding:18px}.hero-top{display:block}.year{margin-top:13px}.profit{font-size:36px}.kpis{gap:7px}.kpi{padding:11px}.kpi .value{font-size:15px}.form{grid-template-columns:1fr 1fr}.section-head{padding:15px 14px 11px}.trades{padding:0 9px 9px}.trade{grid-template-columns:42px 1fr auto;gap:9px;padding:13px 4px}.logo{width:39px;height:39px}.trade-result .profit{font-size:12px}.trade-main b{font-size:12px}.detail-grid,.modal-grid{grid-template-columns:1fr}.modal-grid .field.full{grid-column:auto}.hero-sub{max-width:310px}}

<body><div id="root"></div>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-app.js";
import {getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,updateProfile,signOut} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-auth.js";
import {getFirestore,collection,addDoc,deleteDoc,doc,onSnapshot,query,orderBy,serverTimestamp} from "https://www.gstatic.com/firebasejs/12.2.1/firebase-firestore.js";
const CONFIG=window.APP_CONFIG||{},root=document.getElementById('root');let app,auth,db,unsubTrades=null,unsubCharges=null,trades=[],charges=[],selectedYear='all';
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:2}).format(Number(n)||0);
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const fmt=d=>d?new Date(d+'T00:00:00').toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}):'—';
const initials=s=>String(s||'?').replace(/[^A-Z0-9]/gi,'').slice(0,2).toUpperCase()||'?';
const logoUrl=t=>t?`https://dharunashokkumar.github.io/indian-listed-company-logos/nse/NSE_${encodeURIComponent(String(t).toUpperCase())}.svg`:'';
function logoHtml(t){const u=t.logoUrl||logoUrl(t.ticker||t.stock);return u?`<img src="${esc(u)}" onerror="this.style.display='none';this.parentElement.textContent='${esc(initials(t.ticker||t.stock))}'">`:esc(initials(t.ticker||t.stock))}
function days(a,b){return Math.max(0,(new Date(b+'T00:00:00')-new Date(a+'T00:00:00'))/86400000)}
function overallCagr(ts){if(!ts.length)return null;const first=ts.reduce((a,b)=>(b.buyDate<a.buyDate?b:a));const last=ts.reduce((a,b)=>(b.sellDate>a.sellDate?b:a));const cost=ts.reduce((s,t)=>s+Number(t.cost||0),0),sale=ts.reduce((s,t)=>s+Number(t.sale||0),0),y=days(first.buyDate,last.sellDate)/365.25;if(cost<=0||sale<=0||y<=0)return null;return Math.pow(sale/cost,1/y)-1}
function authId(u){return String(u||'').trim().toLowerCase()+'@bookedprofittracker.app'}
function validUsername(u){return /^[a-zA-Z0-9_]{3,24}$/.test(u)}
function authScreen(mode='login',msg=''){root.innerHTML=`<main class="auth"><div class="auth-card"><div class="auth-mark"><svg viewBox="0 0 48 48" width="34" fill="none"><path d="M7 35 17 25l8 7 15-19" stroke="#42df9b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><h2>${mode==='login'?'Welcome back':'Create your account'}</h2><p>Use the same username and password on your phone and your father's phone. Your sold trades and profit update live in the cloud. No Gmail required.</p><div class="field"><label>Username</label><input id="user" maxlength="24" placeholder="e.g. mohit_01"></div><div class="field"><label>Password</label><input id="pass" type="password" placeholder="6+ characters"></div><div class="error">${esc(msg)}</div><div class="auth-actions"><button class="primary" id="go">${mode==='login'?'Sign in':'Create account'}</button><button class="secondary" id="switchBtn">${mode==='login'?'Create a new account':'I already have an account'}</button></div><div class="foot">Private cloud data · Live sync</div></div></main>`;go.onclick=async()=>{const u=user.value.trim(),p=pass.value;if(!validUsername(u))return authScreen(mode,'Username: 3–24 letters, numbers or underscore.');if(p.length<6)return authScreen(mode,'Password must be at least 6 characters.');try{const e=authId(u);if(mode==='login')await signInWithEmailAndPassword(auth,e,p);else{const c=await createUserWithEmailAndPassword(auth,e,p);await updateProfile(c.user,{displayName:u})}}catch(e){authScreen(mode,pretty(e))}};switchBtn.onclick=()=>authScreen(mode==='login'?'signup':'login')}
function pretty(e){const c=e?.code||'';return c.includes('invalid-credential')?'Username or password is incorrect.':c.includes('email-already-in-use')?'That username is already taken.':c.includes('weak-password')?'Use a stronger password (6+ characters).':e?.message||'Something went wrong.'}
function appShell(){root.innerHTML=`<main class="app"><header class="top"><div class="brand"><div class="mark"><svg viewBox="0 0 48 48" fill="none"><path d="M7 35 17 25l8 7 15-19" stroke="#42df9b" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div><h1>Booked Profit Tracker</h1><p>Realized money. Clearly organized.</p></div></div><div class="right"><div class="sync"><span class="dot"></span>Live sync</div><button class="icon" id="settings">⚙</button></div></header>
<section class="hero"><div class="hero-top"><div><div class="eyebrow" id="periodLabel">All years · Net realized profit</div><div id="profit" class="profit pos">₹0</div><div class="hero-sub">Gross profit after manually entered charges</div></div><select id="year" class="year"></select></div></section>
<div class="kpis"><div class="kpi"><div class="label">Invested</div><div class="value" id="cost">₹0</div><div class="hint">Total buy value</div></div><div class="kpi"><div class="label">Sold for</div><div class="value" id="sale">₹0</div><div class="hint">Total sell value</div></div><div class="kpi"><div class="label">Return</div><div class="value pos" id="ret">—</div><div class="hint">Profit ÷ invested</div></div><div class="kpi"><div class="label">Overall CAGR</div><div class="value pos" id="cagr">—</div><div class="hint">Selected period</div></div></div>
<div class="actions"><button class="primary" id="addTradeOpen">＋ Add sold trade</button><button class="secondary" id="addChargeOpen">＋ Add charge</button><button class="secondary" id="exportBtn">Export</button></div>
<section class="card section"><div class="section-head"><div><h3 class="title">Charges</h3><p class="sub">Enter brokerage, taxes or other costs manually.</p></div><div id="chargeTotal" class="title">₹0</div></div><div class="charges-line"><span>Charges reduce your net realized profit.</span><b id="tradeCount">0 trades</b></div></section>
<section class="card section"><div class="section-head"><div><h3 class="title">Sold shares</h3><p class="sub">Each company shows the exact profit and % booked.</p></div></div><div class="trades" id="trades"></div></section>
<div class="foot">Signed in as ${esc(auth.currentUser?.displayName||'account')} · Cloud synchronized</div></main>`;
year.onchange=()=>{selectedYear=year.value;render()};addTradeOpen.onclick=tradeModal;addChargeOpen.onclick=chargeModal;exportBtn.onclick=exportData;settings.onclick=settingsModal;render()}
function yearOptions(){const ys=new Set();trades.forEach(t=>{if(t.sellDate)ys.add(t.sellDate.slice(0,4))});charges.forEach(c=>{if(c.date)ys.add(c.date.slice(0,4))});return ['all',...Array.from(ys).sort().reverse()]}
function filteredTrades(){return trades.filter(t=>selectedYear==='all'||String(t.sellDate||'').slice(0,4)===selectedYear)}
function filteredCharges(){return charges.filter(c=>selectedYear==='all'||String(c.date||'').slice(0,4)===selectedYear)}
function render(){if(!document.getElementById('year'))return;const opts=yearOptions();if(!opts.includes(selectedYear))selectedYear=opts[0];year.innerHTML=opts.map(y=>`<option value="${y}">${y==='all'?'All years':y}</option>`).join('');year.value=selectedYear;const ts=filteredTrades(),cs=filteredCharges();const cost=ts.reduce((s,t)=>s+Number(t.cost||0),0),sale=ts.reduce((s,t)=>s+Number(t.sale||0),0),gross=sale-cost,charge=cs.reduce((s,c)=>s+Number(c.amount||0),0),net=gross-charge,ret=cost?gross/cost:null,cr=overallCagr(ts);profit.textContent=money(net);profit.className='profit '+(net>=0?'pos':'neg');document.getElementById('periodLabel').textContent=`${selectedYear==='all'?'All years':selectedYear} · Net realized profit`;document.getElementById('cost').textContent=money(cost);document.getElementById('sale').textContent=money(sale);document.getElementById('ret').textContent=ret==null?'—':(ret*100).toFixed(2)+'%';document.getElementById('ret').className='value '+(ret!=null&&ret>=0?'pos':'neg');document.getElementById('cagr').textContent=cr==null?'—':(cr*100).toFixed(2)+'%';document.getElementById('cagr').className='value '+(cr!=null&&cr>=0?'pos':'neg');document.getElementById('chargeTotal').textContent=money(charge);document.getElementById('tradeCount').textContent=ts.length+(ts.length===1?' trade':' trades');const box=document.getElementById('trades');if(!ts.length){box.innerHTML='<div class="empty"><strong>No sold shares for this period</strong>Add a completed buy → sell trade to see it here.</div>';return}box.innerHTML=ts.slice().sort((a,b)=>(b.sellDate||'').localeCompare(a.sellDate||'')).map(t=>{const qty=Number(t.quantity||1),avg=Number(t.avgBuy||0),sp=Number(t.sellPrice??(qty?Number(t.sale||0)/qty:0)),c=Number(t.cost??qty*avg),s=Number(t.sale??qty*sp),p=s-c,r=c?p/c:0;return `<div class="trade"><div class="logo">${logoHtml(t)}</div><div class="trade-main"><b>${esc(t.ticker||t.stock)}</b><span>${fmt(t.buyDate)} → ${fmt(t.sellDate)} · ${qty} shares</span></div><div class="stat"><span class="k">Buy → Sell</span><span class="v">${money(avg)} → ${money(sp)}</span></div><div class="stat"><span class="k">Value</span><span class="v">${money(c)} → ${money(s)}</span></div><div class="trade-result"><div class="profit ${p>=0?'pos':'neg'}">${p>=0?'+':''}${money(p)}</div><div class="return ${r>=0?'pos':'neg'}">${r>=0?'+':''}${(r*100).toFixed(2)}% booked</div></div><button class="delete" data-id="${t.id}" title="Delete">×</button></div>`}).join('');box.querySelectorAll('.trade-main,.stat,.trade-result,.logo').forEach(el=>el.parentElement.onclick=e=>{if(!e.target.classList.contains('delete')){const t=ts.find(x=>x.id===el.parentElement.querySelector('.delete').dataset.id);if(t)detailModal(t)}});box.querySelectorAll('.delete').forEach(b=>b.onclick=async e=>{e.stopPropagation();if(confirm('Delete this trade?'))await deleteDoc(doc(db,'users',auth.currentUser.uid,'trades',b.dataset.id))})}
function tradeModal(){const back=document.createElement('div');back.className='modal-back open';back.innerHTML=`<div class="modal"><button class="close" id="x">×</button><h3>Add sold trade</h3><p>Enter the completed buy → sell details. Buy and sell values are calculated automatically.</p><div class="modal-grid"><div class="field full"><label>Company / ticker</label><input id="mTicker" placeholder="TCS, RELIANCE, HBLENG"></div><div class="field"><label>No. of shares</label><input id="mQty" type="number" min="0.0001" step="0.0001" placeholder="100"></div><div class="field"><label>Average buy price ₹</label><input id="mBuy" type="number" min="0.01" step=".01" placeholder="500"></div><div class="field"><label>Sell price ₹</label><input id="mSell" type="number" min="0" step=".01" placeholder="700"></div><div class="field"><label>Buy date</label><input id="mBD" type="date"></div><div class="field"><label>Sell date</label><input id="mSD" type="date"></div><div class="field"><label>Total buy value</label><div class="auto" id="mCost">Auto</div></div><div class="field"><label>Total sell value</label><div class="auto" id="mSale">Auto</div></div></div><div class="modal-actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save trade</button></div></div>`;document.body.appendChild(back);mBD.value=mSD.value=new Date().toISOString().slice(0,10);const calc=()=>{const q=Number(mQty.value||0),b=Number(mBuy.value||0),s=Number(mSell.value||0);mCost.textContent=q&&b?money(q*b):'Auto';mSale.textContent=q&&s?money(q*s):'Auto'};[mQty,mBuy,mSell].forEach(x=>x.oninput=calc);x.onclick=cancel.onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};save.onclick=async()=>{const ticker=mTicker.value.trim().toUpperCase().replace(/\s+/g,''),q=Number(mQty.value),b=Number(mBuy.value),s=Number(mSell.value),bd=mBD.value,sd=mSD.value;if(!ticker||!(q>0)||!(b>0)||!(s>=0)||!bd||!sd)return alert('Please complete all fields.');if(sd<=bd)return alert('Sell date must be after buy date.');try{await addDoc(collection(db,'users',auth.currentUser.uid,'trades'),{ticker,stock:ticker,quantity:q,avgBuy:b,sellPrice:s,buyDate:bd,sellDate:sd,cost:q*b,sale:q*s,logoUrl:logoUrl(ticker),createdAt:serverTimestamp()});back.remove()}catch(e){alert('Could not save trade.')}}}
function chargeModal(){const back=document.createElement('div');back.className='modal-back open';back.innerHTML=`<div class="modal"><button class="close" id="x">×</button><h3>Add charge</h3><p>Manually enter brokerage, taxes, GST, exchange charges or any other cost. It will reduce net profit for that date/year.</p><div class="modal-grid"><div class="field"><label>Charge amount ₹</label><input id="ca" type="number" min="0" step=".01" placeholder="2439.90"></div><div class="field"><label>Date</label><input id="cd" type="date"></div><div class="field full"><label>Note (optional)</label><input id="cn" maxlength="80" placeholder="Brokerage + taxes"></div></div><div class="modal-actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save charge</button></div></div>`;document.body.appendChild(back);cd.value=new Date().toISOString().slice(0,10);x.onclick=cancel.onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};save.onclick=async()=>{const amount=Number(ca.value),date=cd.value,note=cn.value.trim();if(!(amount>=0)||!date)return alert('Enter amount and date.');try{await addDoc(collection(db,'users',auth.currentUser.uid,'charges'),{amount,date,note,createdAt:serverTimestamp()});back.remove()}catch(e){alert('Could not save charge.')}}}
function detailModal(t){const qty=Number(t.quantity||1),avg=Number(t.avgBuy||0),sp=Number(t.sellPrice??(qty?Number(t.sale||0)/qty:0)),c=Number(t.cost??qty*avg),s=Number(t.sale??qty*sp),p=s-c,r=c?p/c:0;const back=document.createElement('div');back.className='modal-back open';back.innerHTML=`<div class="modal"><button class="close" id="x">×</button><div class="detail-head"><div class="detail-logo">${logoHtml(t)}</div><div class="detail-name"><b>${esc(t.ticker||t.stock)}</b><span>${qty} shares · ${fmt(t.buyDate)} → ${fmt(t.sellDate)}</span></div></div><div class="detail-grid"><div class="detail-item"><span>Average buy</span><b>${money(avg)}</b></div><div class="detail-item"><span>Sell price</span><b>${money(sp)}</b></div><div class="detail-item"><span>Total buy value</span><b>${money(c)}</b></div><div class="detail-item"><span>Total sell value</span><b>${money(s)}</b></div><div class="detail-item"><span>Booked profit</span><b class="${p>=0?'pos':'neg'}">${p>=0?'+':''}${money(p)}</b></div><div class="detail-item"><span>Return booked</span><b class="${r>=0?'pos':'neg'}">${r>=0?'+':''}${(r*100).toFixed(2)}%</b></div></div><div class="modal-actions"><button class="secondary" id="cancel">Close</button></div></div>`;document.body.appendChild(back);x.onclick=cancel.onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()}}
function settingsModal(){const back=document.createElement('div');back.className='modal-back open';back.innerHTML=`<div class="modal"><button class="close" id="x">×</button><h3>Account</h3><p>Use this same username and password on your father's phone. Firestore keeps the trades and charges synchronized live across devices. No Gmail is required.</p><div class="modal-actions"><button class="secondary" id="signout">Sign out</button></div></div>`;document.body.appendChild(back);x.onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};signout.onclick=()=>signOut(auth)}
function exportData(){const data={exportedAt:new Date().toISOString(),trades,charges};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='booked-profit-tracker-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function init(){if(!CONFIG.firebase?.apiKey||CONFIG.firebase.apiKey.includes('PASTE_')){root.innerHTML='<main class="auth"><div class="auth-card"><h2>One-time setup needed</h2><p>Add the Firebase web configuration to app-config.js.</p></div></main>';return}app=initializeApp(CONFIG.firebase);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,user=>{if(!user){if(unsubTrades)unsubTrades();if(unsubCharges)unsubCharges();authScreen('login');return}appShell();const base=['users',user.uid];unsubTrades=onSnapshot(query(collection(db,...base,'trades'),orderBy('sellDate','desc')),s=>{trades=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>alert('Cloud sync failed for trades. Check Firestore rules.'));unsubCharges=onSnapshot(query(collection(db,...base,'charges'),orderBy('date','desc')),s=>{charges=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>alert('Cloud sync failed for charges. Check Firestore rules.'))})}init();
</script></body></html>
