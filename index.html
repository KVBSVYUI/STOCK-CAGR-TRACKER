(err){alert('Could not delete fund profit: '+(err.code||'error')+' - '+(err.message||''))}})}

const chargeBox=document.getElementById('chargeList');if(chargeBox){chargeBox.innerHTML=cs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).map(c=>`<div class="charge-row"><div class="charge-info"><b>${esc(c.note||'Charge')}</b><span>${fmt(c.date)}</span></div><div></div><div class="charge-amount">−${money(c.amount)}</div><div class="charge-actions"><button class="mini-btn" data-edit-charge="${c.id}">Edit</button><button class="mini-btn delete-charge" data-delete-charge="${c.id}">×</button></div></div>`).join('');chargeBox.querySelectorAll('[data-edit-charge]').forEach(b=>b.onclick=e=>{e.stopPropagation();const c=charges.find(x=>x.id===b.dataset.editCharge);if(c)chargeModal(c)});chargeBox.querySelectorAll('[data-delete-charge]').forEach(b=>b.onclick=async e=>{e.stopPropagation();const c=charges.find(x=>x.id===b.dataset.deleteCharge);if(c&&confirm(`Delete this charge of ${money(c.amount)}?`))try{await deleteDoc(doc(db,'users',auth.currentUser.uid,'charges',c.id))}catch(err){alert('Could not delete charge: '+(err.code||'error')+' - '+(err.message||''))}})}

const box=document.getElementById('trades');if(!ts.length){box.innerHTML='<div class="empty"><strong>No sold shares for this period</strong>Add a completed buy → sell trade to see it here.</div>';return}const sortMode=document.getElementById('tradeSort')?.value||'latest';const sorted=ts.slice().sort((a,b)=>{const aq=Number(a.quantity||1),ab=Number(a.avgBuy||0),asp=Number(a.sellPrice??(aq?Number(a.sale||0)/aq:0)),ac=Number(a.cost??aq*ab),as=Number(a.sale??aq*asp),ap=as-ac,ar=ac?ap/ac:0;const bq=Number(b.quantity||1),bb=Number(b.avgBuy||0),bsp=Number(b.sellPrice??(bq?Number(b.sale||0)/bq:0)),bc=Number(b.cost??bq*bb),bs=Number(b.sale??bq*bsp),bp=bs-bc,br=bc?bp/bc:0;if(sortMode==='profit')return bp-ap;if(sortMode==='percent')return br-ar;return (b.sellDate||'').localeCompare(a.sellDate||'')});box.innerHTML=sorted.map(t=>{const qty=Number(t.quantity||1),avg=Number(t.avgBuy||0),sp=Number(t.sellPrice??(qty?Number(t.sale||0)/qty:0)),c=Number(t.cost??qty*avg),s=Number(t.sale??qty*sp),p=s-c,r=c?p/c:0;return `<div class="trade"><div class="logo">${logoHtml(t)}</div><div class="trade-main"><b>${esc(displayCompanyName(t))}</b><span>${esc(t.ticker||t.stock)} · ${fmt(t.buyDate)} → ${fmt(t.sellDate)} · ${qty} shares</span></div><div class="stat"><span class="k">Buy → Sell</span><span class="v">${money(avg)} → ${money(sp)}</span></div><div class="stat"><span class="k">Value</span><span class="v">${money(c)} → ${money(s)}</span></div><div class="trade-result"><div class="profit ${p>=0?'pos':'neg'}">${p>=0?'+':''}${money(p)}</div><div class="return ${r>=0?'pos':'neg'}">${r>=0?'+':''}${(r*100).toFixed(2)}% booked</div></div><button type="button" class="delete" data-id="${esc(t.id)}" title="Delete trade" aria-label="Delete trade" onclick="event.preventDefault();event.stopPropagation();window.BPT_DELETE_TRADE&&window.BPT_DELETE_TRADE(this.dataset.id,this)">×</button></div>`}).join('');box.onclick=e=>{const row=e.target.closest?.('.trade');if(!row||!box.contains(row)||e.target.closest?.('.delete'))return;const id=row.querySelector('.delete')?.dataset.id;const t=ts.find(x=>x.id===id);if(t)detailModal(t)};window.BPT_DELETE_TRADE=async function(id,btn){if(!id||!auth.currentUser)return;const ok=confirm('Delete this trade?');if(!ok)return;btn.disabled=true;btn.textContent='…';try{await deleteDoc(doc(db,'users',auth.currentUser.uid,'trades',id))}catch(err){btn.disabled=false;btn.textContent='×';alert('Could not delete trade: '+(err.code||'error')+' - '+(err.message||'Please try again.'))}}}
function tradeModal(){const back=document.createElement('div');back.className='modal-back open';back.innerHTML=`<div class="modal"><button class="close" id="x">×</button><h3>Add sold trade</h3><p>Enter the completed buy → sell details. Buy and sell values are calculated automatically.</p><div class="modal-grid"><div class="field full company-field"><label>Company / ticker</label><input id="mTicker" placeholder="Type company name or ticker" autocomplete="off"><div id="mCompanyPreview" class="company-suggest" hidden></div></div><div class="field"><label>No. of shares</label><input id="mQty" type="number" min="0.0001" step="0.0001" placeholder="100"></div><div class="field"><label>Average buy price ₹</label><input id="mBuy" type="number" min="0.01" step=".01" placeholder="500"></div><div class="field"><label>Sell price ₹</label><input id="mSell" type="number" min="0" step=".01" placeholder="700"></div><div class="field"><label>Buy date</label><input id="mBD" type="date"></div><div class="field"><label>Sell date</label><input id="mSD" type="date"></div><div class="field"><label>Total buy value</label><div class="auto" id="mCost">Auto</div></div><div class="field"><label>Total sell value</label><div class="auto" id="mSale">Auto</div></div></div><div class="modal-actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">Save trade</button></div></div>`;document.body.appendChild(back);mBD.value=mSD.value=new Date().toISOString().slice(0,10);const calc=()=>{const q=Number(mQty.value||0),b=Number(mBuy.value||0),s=Number(mSell.value||0);mCost.textContent=q&&b?money(q*b):'Auto';mSale.textContent=q&&s?money(q*s):'Auto'};[mQty,mBuy,mSell].forEach(x=>x.oninput=calc);x.onclick=cancel.onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};save.onclick=async()=>{const ticker=normalTicker(mTicker.value),q=Number(mQty.value),b=Number(mBuy.value),s=Number(mSell.value),bd=mBD.value,sd=mSD.value;if(!ticker||!(q>0)||!(b>0)||!(s>=0)||!bd||!sd)return alert('Please complete all fields.');if(sd<=bd)return alert('Sell date must be after buy date.');try{const resolved=window.BPT_STOCK_RESOLVE?await window.BPT_STOCK_RESOLVE(ticker):{name:KNOWN_STOCK_NAMES[ticker]||mTicker.dataset.selectedCompany||ticker,exchange:mTicker.dataset.selectedExchange||'NSE',isin:mTicker.dataset.selectedIsin||''};await addDoc(collection(db,'users',auth.currentUser.uid,'trades'),{ticker,stock:ticker,quantity:q,avgBuy:b,sellPrice:s,buyDate:bd,sellDate:sd,cost:q*b,sale:q*s,logoUrl:logoUrl(ticker,resolved.exchange,resolved.isin),companyName:resolved.name||ticker,exchange:resolved.exchange||'NSE',isin:resolved.isin||'',createdAt:serverTimestamp()});back.remove()}catch(e){alert('Could not save trade.')}}}
function fundProfitModal(existing=null){const back=document.createElement('div');back.className='modal-back open';const editing=!!(existing&&existing.id);back.innerHTML=`<div class="modal"><button class="close" id="x">×</button><h3>${editing?'Edit mutual fund':'Add mutual fund profit'}</h3><p>Enter the total amount invested in the redeemed portion and the profit you booked. Return % is calculated automatically.</p><div class="modal-grid"><div class="field full"><label>Mutual fund name</label><input id="fName" maxlength="80" placeholder="e.g. Motilal Oswal Midcap Fund"></div><div class="field"><label>Total buy value / invested ₹</label><input id="fInvested" type="number" min="0.01" step=".01" placeholder="100000"></div><div class="field"><label>Booked profit ₹</label><input id="fProfitInput" type="number" step=".01" placeholder="15000"></div><div class="field"><label>Booked return</label><div class="auto" id="fReturn">Auto</div></div><div class="field"><label>Redemption date</label><input id="fDate" type="date"></div></div><div class="modal-actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">${editing?'Update':'Save profit'}</button></div></div>`;document.body.appendChild(back);fName.value=existing?.name||'';fInvested.value=existing?.invested??'';fProfitInput.value=existing?.profit??'';fDate.value=existing?.date||new Date().toISOString().slice(0,10);const calc=()=>{const i=Number(fInvested.value||0),p=Number(fProfitInput.value||0);fReturn.textContent=i?((p/i)*100).toFixed(2)+'%':'Auto'};[fInvested,fProfitInput].forEach(x=>x.oninput=calc);calc();x.onclick=cancel.onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};save.onclick=async()=>{const name=fName.value.trim(),invested=Number(fInvested.value),profit=Number(fProfitInput.value),date=fDate.value,redeemed=invested+profit;if(!name||!(invested>0)||!Number.isFinite(profit)||!date)return alert('Please complete the mutual fund name, total buy value, booked profit and date.');try{const data={name,type:'Mutual Fund',date,invested,redeemed,profit};if(editing)await updateDoc(doc(db,'users',auth.currentUser.uid,'fundProfits',existing.id),data);else await addDoc(collection(db,'users',auth.currentUser.uid,'fundProfits'),{...data,createdAt:serverTimestamp()});back.remove()}catch(e){alert((editing?'Could not update mutual fund: ':'Could not save mutual fund: ')+(e.code||'error')+' - '+(e.message||''))}}}
function chargeModal(existing=null){const back=document.createElement('div');back.className='modal-back open';const editing=!!existing;back.innerHTML=`<div class="modal"><button class="close" id="x">×</button><h3>${editing?'Edit charge':'Add charge'}</h3><p>Manually enter brokerage, taxes, GST, exchange charges or any other cost. It will reduce net profit for that date/year.</p><div class="modal-grid"><div class="field"><label>Charge amount ₹</label><input id="ca" type="number" min="0" step=".01" placeholder="2439.90"></div><div class="field"><label>Date</label><input id="cd" type="date"></div><div class="field full"><label>Note (optional)</label><input id="cn" maxlength="80" placeholder="Brokerage + taxes"></div></div><div class="modal-actions"><button class="secondary" id="cancel">Cancel</button><button class="primary" id="save">${editing?'Update charge':'Save charge'}</button></div></div>`;document.body.appendChild(back);ca.value=existing?Number(existing.amount||0):'';cd.value=existing?.date||new Date().toISOString().slice(0,10);cn.value=existing?.note||'';x.onclick=cancel.onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};save.onclick=async()=>{const amount=Number(ca.value),date=cd.value,note=cn.value.trim();if(!(amount>=0)||!date)return alert('Enter amount and date.');try{if(editing){const ref=doc(db,'users',auth.currentUser.uid,'charges',existing.id);await updateDoc(ref,{amount,date,note})}else{await addDoc(collection(db,'users',auth.currentUser.uid,'charges'),{amount,date,note,createdAt:serverTimestamp()})}back.remove()}catch(e){alert((editing?'Could not update charge: ':'Could not save charge: ')+(e.code||'error')+' - '+(e.message||''))}}}
function detailModal(t){const qty=Number(t.quantity||1),avg=Number(t.avgBuy||0),sp=Number(t.sellPrice??(qty?Number(t.sale||0)/qty:0)),c=Number(t.cost??qty*avg),s=Number(t.sale??qty*sp),p=s-c,r=c?p/c:0;const back=document.createElement('div');back.className='modal-back open';back.innerHTML=`<div class="modal"><button class="close" id="x">×</button><div class="detail-head"><div class="detail-logo">${logoHtml(t)}</div><div class="detail-name"><b>${esc(displayCompanyName(t))}</b><span>${esc(t.ticker||t.stock)} · ${qty} shares · ${fmt(t.buyDate)} → ${fmt(t.sellDate)}</span></div></div><div class="detail-grid"><div class="detail-item"><span>Average buy</span><b>${money(avg)}</b></div><div class="detail-item"><span>Sell price</span><b>${money(sp)}</b></div><div class="detail-item"><span>Total buy value</span><b>${money(c)}</b></div><div class="detail-item"><span>Total sell value</span><b>${money(s)}</b></div><div class="detail-item"><span>Booked profit</span><b class="${p>=0?'pos':'neg'}">${p>=0?'+':''}${money(p)}</b></div><div class="detail-item"><span>Return booked</span><b class="${r>=0?'pos':'neg'}">${r>=0?'+':''}${(r*100).toFixed(2)}%</b></div></div><div class="modal-actions"><button class="secondary" id="cancel">Close</button></div></div>`;document.body.appendChild(back);x.onclick=cancel.onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()}}
function settingsModal(){const back=document.createElement('div');back.className='modal-back open';back.innerHTML=`<div class="modal"><button class="close" id="x">×</button><h3>Account</h3><p>Use this same username and password on your father's phone. Firestore keeps the trades and charges synchronized live across devices. No Gmail is required.</p><div class="modal-actions"><button class="secondary" id="signout">Sign out</button></div></div>`;document.body.appendChild(back);x.onclick=()=>back.remove();back.onclick=e=>{if(e.target===back)back.remove()};signout.onclick=()=>signOut(auth)}
function exportData(){const data={exportedAt:new Date().toISOString(),trades,charges,fundProfits};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='booked-profit-tracker-export.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)}
function init(){if(!CONFIG.firebase?.apiKey||CONFIG.firebase.apiKey.includes('PASTE_')){root.innerHTML='<main class="auth"><div class="auth-card"><h2>One-time setup needed</h2><p>Add the Firebase web configuration to app-config.js.</p></div></main>';return}app=initializeApp(CONFIG.firebase);auth=getAuth(app);db=getFirestore(app);onAuthStateChanged(auth,user=>{if(!user){if(unsubTrades)unsubTrades();if(unsubCharges)unsubCharges();if(unsubFundProfits)unsubFundProfits();authScreen('login');return}appShell();const base=['users',user.uid];unsubTrades=onSnapshot(query(collection(db,...base,'trades'),orderBy('sellDate','desc')),s=>{trades=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>alert('Cloud sync failed for trades. Check Firestore rules.'));unsubCharges=onSnapshot(query(collection(db,...base,'charges'),orderBy('date','desc')),s=>{charges=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>alert('Cloud sync failed for charges. Check Firestore rules.'));unsubFundProfits=onSnapshot(query(collection(db,...base,'fundProfits'),orderBy('date','desc')),s=>{fundProfits=s.docs.map(d=>({id:d.id,...d.data()}));render()},()=>alert('Cloud sync failed for mutual fund profits. Check Firestore rules.'))})}init();
</script></body></html>
